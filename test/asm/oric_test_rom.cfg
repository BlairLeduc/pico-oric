# ld65 configuration for oric_test_rom.s: one 16 KiB image for the
# socket at #C000, the vectors in its last six bytes (design.md §13.3).
MEMORY {
    ROM: start = $C000, size = $3FFA, fill = yes, fillval = $FF, file = %O;
    VEC: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
    CODE:    load = ROM, type = ro;
    VECTORS: load = VEC, type = ro;
}
